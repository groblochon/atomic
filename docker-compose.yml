services:
  server:
    image: ghcr.io/kenforthewin/atomic-server:latest
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - ATOMIC_SETUP_TOKEN=${ATOMIC_SETUP_TOKEN:-}
      - ATOMIC_STORAGE=postgres
      - ATOMIC_DATABASE_URL=postgresql://atomic:atomic@postgres:5432/atomic
      - ATOMIC_DANGEROUSLY_SKIP_SETUP_TOKEN=false
    volumes:
      - atomic-data:/data
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    image: ghcr.io/kenforthewin/atomic-web:latest
    restart: unless-stopped

  proxy:
    image: nginx:1.28-bookworm
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - web
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.3
    profiles:
      - backup
    volumes:
      - atomic-data:/data
      - ./docker/litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_ACCESS_KEY_ID
      - LITESTREAM_SECRET_ACCESS_KEY
      - LITESTREAM_BUCKET
      - LITESTREAM_ENDPOINT
      - LITESTREAM_PATH
    entrypoint: [ "litestream", "replicate", "-config", "/etc/litestream.yml" ]
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atomic
      POSTGRES_USER: atomic
      POSTGRES_PASSWORD: atomic
    ports:
      - "5432:5432"
    volumes:
      - atomic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U atomic" ]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  atomic-data:
  atomic-postgres-data:
